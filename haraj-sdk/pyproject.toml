[project]
name = "haraj-sdk"
version = "0.1.0"
description = "Python SDK, CLI, and MCP server for haraj.com.sa (حراج) - Saudi Arabia's largest classifieds marketplace"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FarisHijazi" }]
keywords = ["haraj", "حراج", "saudi", "classifieds", "marketplace", "scraper"]

dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "mcp>=1.0",
]

[project.scripts]
haraj = "haraj.cli:cli"

[project.entry-points."mcp.servers"]
haraj = "haraj.mcp_server:mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haraj"]
